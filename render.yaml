services:
  - type: web
    name: return-abuse-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    pythonVersion: "3.11.9"
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        value: mongodb://localhost:27017
      - key: MONGODB_DB_NAME
        value: returns_db
      - key: MONGODB_COLLECTION
        value: return_cases
